services:
  subx-bridge:
    build: .
    container_name: subx-bridge
    environment:
      SUBX_API_KEYS: "change-me-api-key"
      SUBDIVX_CF_CLEARANCE: "PEGAR_CF_CLEARANCE"
      SUBDIVX_SDX: "PEGAR_SDX"
      SUBDIVX_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64; rv:148.0) Gecko/20100101 Firefox/148.0"
      LOG_LEVEL: "INFO"
    ports:
      - "8787:8787"
    restart: unless-stopped
