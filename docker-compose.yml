version: '3.9'

services:
  jackett:
    image: "linuxserver/jackett:version-v0.22.2200"
    container_name: jackett
    hostname: jackett
    restart: unless-stopped
    volumes:
      - "${STORAGE_LOCATION}/jackett/config:/config"
      - "/etc/localtime:/etc/localtime:ro"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - main
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jackett.rule=Host(`jackett.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.jackett.tls=true"
      - "traefik.http.routers.jackett.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.jackett.entrypoints=websecure,web"
      - "traefik.http.routers.jackett.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.jackett.loadbalancer.server.port=9117"
      - "group=mediaserver"
    profiles:
      - indexers

  plex:
    image: "plexinc/pms-docker:1.41.3.9314-a0bfb8370"
    container_name: plex
    restart: unless-stopped
    ports:
      - "32400:32400/tcp"
      - "3005:3005/tcp"
    environment:
      - TZ=${DOCKER_TZ}
      - PLEX_CLAIM=${PLEX_CLAIM}
      - PUID=${PUID}
      - PGID=${PGID}
    hostname: ${PLEX_HOSTNAME}
    volumes:
      - "${STORAGE_LOCATION}/plex:/config"
      - "${STORAGE_LOCATION}/plex:/transcode"
      - ${MEDIA_LOCATION}:/media:ro
      - /tmp:/tmp
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.plex.tls=true"
      - "traefik.http.routers.plex.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.plex.entrypoints=websecure,web"
      - "traefik.http.routers.plex.middlewares=tls-headers"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
      - "group=mediaserver"
    networks:
      - main
    profiles:
      - plex

  sonarr:
    image: "linuxserver/sonarr:4.0.12"
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    volumes:
     - "/etc/localtime:/etc/localtime:ro"
     - "${STORAGE_LOCATION}/sonarr/config:/config"
     - ${MEDIA_LOCATION}:/media
    environment:
     - PUID=${PUID}
     - PGID=${PGID}
     - VIRTUAL_HOST=sonarr.${BASE_DOMAIN_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.sonarr.entrypoints=websecure,web"
      - "traefik.http.routers.sonarr.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "group=mediaserver"
    networks:
      - main
    profiles:
      - servarr
      
  radarr:
    image: "linuxserver/radarr:5.17.2"
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${STORAGE_LOCATION}/radarr/config:/config"
      - ${MEDIA_LOCATION}:/media
    environment:
     - PUID=${PUID}
     - PGID=${PGID}
     - VIRTUAL_HOST=radarr.${BASE_DOMAIN_URL}
    networks:
      - main
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.radarr.entrypoints=websecure,web"
      - "traefik.http.routers.radarr.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "group=mediaserver"
    profiles:
      - servarr

  bazarr:
    image: linuxserver/bazarr:1.5.6
    container_name: bazarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${DOCKER_TZ}
      SUBX_BASE_URL: http://subx-bridge:8787
    restart: unless-stopped
    volumes:
      - ${STORAGE_LOCATION}/bazarr/config:/config
      - ${MEDIA_LOCATION}:/media
      - ./subx-bridge/bazarr-init/99-patch-subx.sh:/custom-cont-init.d/99-patch-subx.sh:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.bazarr.entrypoints=websecure,web"
      - "traefik.http.routers.bazarr.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "group=mediaserver"
    networks:
      - main
    depends_on:
      - sonarr
      - radarr
      - subx-bridge
    profiles:
      - servarr

  subx-bridge:
    build: ./subx-bridge
    image: subx-bridge:local
    container_name: subx-bridge
    restart: unless-stopped
    environment:
      SUBX_API_KEYS: ${SUBX_API_KEYS}
      SUBDIVX_CF_CLEARANCE: ${SUBDIVX_CF_CLEARANCE}
      SUBDIVX_SDX: ${SUBDIVX_SDX}
      SUBDIVX_USER_AGENT: ${SUBDIVX_USER_AGENT}
      LOG_LEVEL: ${SUBX_LOG_LEVEL:-INFO}
    networks:
      - main
    profiles:
      - servarr

  lingarr:
    image: ghcr.io/lingarr-translate/lingarr:1.2.4
    container_name: lingarr
    hostname: lingarr
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:9876
      - DB_CONNECTION=sqlite
      - DB_HANGFIRE_SQLITE_PATH=/app/config/Hangfire.db
      - MAX_CONCURRENT_JOBS=1
      - TZ=${DOCKER_TZ}
      - SERVICE_TYPE=["deepl","gemini"]
      - SOURCE_LANGUAGES=[{"name":"English","code":"en"}]
      - TARGET_LANGUAGES=[{"name":"Spanish","code":"es"}]
      - DEEPL_API_KEY=${LINGARR_DEEPL_API_KEY}
      - GEMINI_API_KEY=${LINGARR_GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${LINGARR_RADARR_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${LINGARR_SONARR_API_KEY}
    volumes:
      - ${STORAGE_LOCATION}/lingarr/config:/app/config
      - ${MEDIA_LOCATION}:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lingarr.rule=Host(`lingarr.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.lingarr.tls=true"
      - "traefik.http.routers.lingarr.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.lingarr.entrypoints=websecure,web"
      - "traefik.http.routers.lingarr.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.lingarr.loadbalancer.server.port=9876"
      - "group=mediaserver"
    networks:
      - main
    depends_on:
      - sonarr
      - radarr
    profiles:
      - servarr

  nzbhydra2:
    image: ghcr.io/linuxserver/nzbhydra2:4.1.0
    container_name: nzbhydra2
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${DOCKER_TZ}
    volumes:
      - ${STORAGE_LOCATION}/nzbhydra:/config
      - ${MEDIA_LOCATION}:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzbhydra.rule=Host(`nzbhydra.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.nzbhydra.tls=true"
      - "traefik.http.routers.nzbhydra.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.nzbhydra.entrypoints=websecure,web"
      - "traefik.http.routers.nzbhydra.middlewares=traefik-forward-auth,tls-headers"
      - "traefik.http.services.nzbhydra.loadbalancer.server.port=5076"
      - "group=mediaserver"
    networks:
      - main
    restart: unless-stopped
    depends_on:
      - jackett
    profiles:
      - indexers

