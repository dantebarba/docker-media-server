  nzbget:
    image: ghcr.io/linuxserver/nzbget:version-v21.1
    container_name: nzbget
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${DOCKER_TZ}
    volumes:
      - ${STORAGE_LOCATION}/nzbget/config:/config
      - ${MEDIA_LOCATION}:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.nzbget-auth.headers.customrequestheaders.Authorization=Basic ${NZB_AUTH}"
      - "traefik.http.routers.nzbget.rule=Host(`nzbget.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.nzbget.tls=true"
      - "traefik.http.routers.nzbget.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.nzbget.entrypoints=websecure,web"
      - "traefik.http.routers.nzbget.middlewares=traefik-forward-auth,tls-headers,nzbget-auth"
      - "traefik.http.services.nzbget.loadbalancer.server.port=6789"
      - "group=mediaserver"
    networks:
      - main
    restart: unless-stopped
    profiles:
      - downloaders

  overseerr:
    image: sctx/overseerr:1.33.2
    container_name: overseerr
    environment:
      - LOG_LEVEL=warning
      - TZ=${DOCKER_TZ}
      - PORT=5055 #optional
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host(`media.${BASE_DOMAIN_URL}`)"
      - "traefik.http.routers.overseerr.tls=true"
      - "traefik.http.routers.overseerr.tls.certresolver=myresolver"
      - "traefik.docker.network=main"
      - "traefik.http.routers.overseerr.entrypoints=websecure,web"
      - "traefik.http.routers.overseerr.middlewares=tls-headers"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"
      - "group=mediaserver"
    volumes:
      - $STORAGE_LOCATION/overseerr:/app/config
    restart: unless-stopped
    networks:
      - main
    depends_on:
      - sonarr
      - radarr
    profiles:
      - servarr
  
  tautulli:
    image: lscr.io/linuxserver/tautulli:2.15.1
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${DOCKER_TZ}
    volumes:
      - ${STORAGE_LOCATION}/tautulli:/config
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.tautulli.rule=Host(`tautulli.${BASE_DOMAIN_URL}`)"
    - "traefik.http.routers.tautulli.tls=true"
    - "traefik.http.routers.tautulli.tls.certresolver=myresolver"
    - "traefik.docker.network=main"
    - "traefik.http.routers.tautulli.entrypoints=websecure,web"
    - "traefik.http.routers.tautulli.middlewares=traefik-forward-auth,tls-headers"
    - "traefik.http.services.tautulli.loadbalancer.server.port=8181"
    - "group=mediaserver"
    restart: unless-stopped
    depends_on:
      - plex
    profiles:
      - plex
    networks:
      - main
networks:
  main:
    external: true



